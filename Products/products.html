<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="products.js"></script>
</head>


<body>
  <div id="navbar"></div>
  <div id="products-container"></div>

<script>
  var card = document.getElementById("products-container");

  candyProducts.forEach(function(p) {
    card.innerHTML += '<div class="product-card">' + '<h2>' + p.name + '</h2>' + '<img src="' + p.image + '" width="200">' + '<p>Price: ' + p.price + '</p>' + '<p>Country:' + p.country + '</p>' + '<p>Brand: ' + p.brand + '</p>' + '<button onclick="viewProducts(' + p.id + ')">View Details</button>' + '<button onclick="addToCart(' + p.id + ')">Add to Cart</button>' + '</div>';
  })

  function viewProducts(id) {
    localStorage.setItem("selectedProductId", id); // Store the selected product ID in localStorage - for use in the product details page
    window.location.href = "productDetails.html";
  }

  function addToCart(id) {
    let productsInCart = JSON.parse(localStorage.getItem("productsInCart")) || []; // Call the existing cart array from localStorage or create an empty array if it doesn't exist
    productsInCart.push(id); // Add the product ID to the cart array
    localStorage.setItem("productsInCart", JSON.stringify(productsInCart)); // Save the updated cart array back to localStorage
    window.location.href = "../basket.html";
  }
  
</script>
<script src="../navbar.js"></script>
</body>
</html>
