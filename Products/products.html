<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>
  <div id="navbar"></div>
  <div id="products-container"></div>

  <script type="module">
    import { createProductCard } from "./productCard.js";
    import { candyProducts, renderProductGrid } from "./products.js";

    renderProductGrid("products-container", candyProducts);

    function viewProducts(id) {
      localStorage.setItem("selectedProductId", id); // Store the selected product ID in localStorage
      window.location.href = "productDetails.html";
    }

    function addToCart(id) {
      let productsInCart = JSON.parse(localStorage.getItem("productsInCart")) || []; // Call the existing cart array from localStorage or create an empty array if it doesn't exist
      productsInCart.push(id); // Add the product ID to the cart array
      localStorage.setItem("productsInCart", JSON.stringify(productsInCart)); // Save the updated cart array back to localStorage
      localStorage.setItem("cart", JSON.stringify(productsInCart));
      window.location.href = "../basket.html";
    }

  </script>
  <script src="../navbar.js"></script>

</body>

</html>
