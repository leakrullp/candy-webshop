<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basket</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

</head>

<body>
  <div id="navbar"></div>
  <main class="container mt-5">
    <header class="text-center mb-5">
      <h1 class="display-4 fw-bold" id="cart-header"></h1>
    </header>
  </main>
  <div id="basket-container"></div>
  <h1 id="cart-sum">
    </div>

    <script type="module">
      import { candyProducts } from "./Products/products.js";

      var basketContainer = document.getElementById("basket-container");
      var sumDiv = document.getElementById("cart-sum");

      var productsInCart = JSON.parse(localStorage.getItem("productsInCart")) || []; // Retrieve the cart array from localStorage or create an empty array if it doesn't exist

      const sum = productsInCart.reduce((acc, pc) => {
        const product = candyProducts.find(p => p.id == pc.id);
        return acc + (product.price * pc.quantity);
      }, 0);
      sumDiv.innerHTML = `Sum: ${sum.toFixed(2)} kr`;

      productsInCart.forEach(function (pc) {
        candyProducts.forEach(function (p) {
          if (pc.id == p.id) {
            basketContainer.innerHTML += `
        <div class="basket-item">
          <h2>${p.name}</h2>
          <img src="${p.image}" class="basket-img">
          <p>Price: ${p.price.toFixed(2)}</p>
          <p>Quantity: <span class="quantity">${pc.quantity}</span></p>
          <button class="remove-btn" onclick="removeFromCart(${p.id})">Remove</button>
        </div>
      `;
          }
        })
      })

      window.removeFromCart = function (id) {
        var productsInCart = JSON.parse(localStorage.getItem("productsInCart"))
        productsInCart = productsInCart.filter(function (item) {
          return item.id !== id; // Remove the specified id from the cart array
        });
        localStorage.setItem("productsInCart", JSON.stringify(productsInCart)); // Save the updated cart array back to localStorage
        window.location.href = "basket.html"; // Refresh the page to update the cart display
      }


    </script>
    <script type="module" src="navbar.js"></script>
    <script src="./messageHandler.js"></script>
</body>

</html>
