<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>

<body>
    <div id="navbar"></div>
    <div class="row">
        <div class="col-sm-4"></div>
        <div class="col-sm-4">
            <div class="container" style="margin:5px">
                <h3>Want to register an account?</h3>
                <form action='index.html'>
                    <label for="fname">First name:</label><br />
                    <input class="form-control" type="text" id="fname" name="fname" value="" /><br />
                    <label for="lname">Last name:</label><br />
                    <input class="form-control" type="text" id="lname" name="lname" value="" /><br /><br />
                    <input class="btn btn-primary" type="submit" onclick="onRegister()" value="Register" />
                    <input type="button" class="btn btn-secondary" value="Cancel"
                        onclick="location.href='index.html';" />
            </div>
            </form>
        </div>

    </div>
    <div class="col-sm-4"></div>
    </div>



    <script type="text/javascript">
        function onRegister() {
            event.preventDefault();

            const fname = document.getElementById("fname").value;
            const lname = document.getElementById("lname").value;

            if (!fname || !lname) {
                alert("Please enter both first and last name.");
                return;
            }

            fetch('/customers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName: fname, lastName: lname })
            })
            .then(res => res.json())
            .then(data => {
                if (data.customer) {
                    localStorage.setItem("customerId", data.customer.id);
                    localStorage.setItem("fname", fname);
                    localStorage.setItem("lname", lname);
                    window.location.href = "index.html";
                } else {
                    alert("Registration failed. Please try again.");
                }
            })
            .catch(err => {
                console.error('Registration error:', err);
                alert("Registration failed. Please try again.");
            });
        }
    </script>

    <script type="module" src="../navbar.js"></script>
</body>

</html>
