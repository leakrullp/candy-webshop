<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candy MEGA Store - Homepage</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.lineicons.com/5.1/line/lineicons.css"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-sm bg-light shadow-sm">
      <div class="container">
        <ul class="navbar-nav w-100 align-items-center">
          <li class="nav-item">
            <a class="nav-link" href="#home">Home</a>
          </li>

          <a class="navbar-brand ms-3" href="#">
            <i class="bi bi-globe-americas spinning-globe"></i>
          </a>

          <li class="nav-item ms-auto">
            <a class="nav-link" href="#login">Login</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#card">
              <i class="bi bi-cart3"></i>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container mt-5">
      <header class="text-center mb-5">
        <h1 class="display-4 fw-bold">
          Welcome to Europe's central Candy MEGA MEGA Store!!
        </h1>
      </header>

      <div id="demo" class="carousel slide shadow" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#demo"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#demo"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#demo"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
          <button
            type="button"
            data-bs-target="#demo"
            data-bs-slide-to="3"
            aria-label="Slide 4"
          ></button>
        </div>

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="https://www.countryflags.com/wp-content/uploads/denmark-flag-png-large.png"
              class="d-block mx-auto"
              alt="Denmark"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://www.countryflags.com/wp-content/uploads/poland-flag-png-large.png"
              class="d-block mx-auto"
              alt="Poland"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://www.countryflags.com/wp-content/uploads/greece-flag-png-large.png"
              class="d-block mx-auto"
              alt="Greece"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://www.countryflags.com/wp-content/uploads/serbia-flag-png-large.png"
              class="d-block mx-auto"
              alt="Serbia"
            />
          </div>
        </div>

        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#demo"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#demo"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <section class="mt-5 p-4 bg-white border rounded shadow-sm">
        <h3 class="mb-4">Filters</h3>
        <div class="row text-center">
          <div class="col-6 col-md-2"><h4>Country</h4></div>
          <div class="col-6 col-md-2"><h4>Category</h4></div>
          <div class="col-6 col-md-2"><h4>Price</h4></div>
          <div class="col-6 col-md-2"><h4>Brand</h4></div>
          <div class="col-6 col-md-2"><h4>Color</h4></div>
          <div class="col-6 col-md-2"><h4>Allergies</h4></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
